services:
  - type: web
    name: dividend-watch-a-share
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn deploy_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
